          python experiments/apparatus_sale_request/verify.py --verify
          python experiments/radio_contacts_and_keys/verify.py --verify
          python experiments/hermannstadt_radio_report/verify.py --verify
          python experiments/military_mission_recalls/verify.py --verify
          python experiments/constantinople_address_parts/verify.py --verify
          python experiments/bidirectional_deciphering/verify.py --verify
          python experiments/retrieved_copy_editions/verify.py --verify
          python experiments/palestine_medical_dissolution/verify.py --verify
          python experiments/newspaper_dispatch_witnesses/verify.py --verify
          python experiments/inventory_and_medical_return/verify.py --verify
