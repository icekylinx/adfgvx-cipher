          python experiments/prague_route_and_situation/verify.py --verify
          python experiments/romanian_ultimatum_companions/verify.py --verify
          python experiments/nov3_radio_and_pioneer/verify.py --verify
          python experiments/p175_c3_gap_followup/verify.py --verify
          python experiments/hauptwechselamt_accounting/verify.py --verify
          python experiments/p64_oil_and_radio/verify.py --verify
          python experiments/late_october_radio_and_materials/verify.py --verify
          python experiments/nov3_medical_radio_withdrawal/verify.py --verify
          python experiments/nov3_medical_radio_withdrawal/independent_source_audit.py --verify
