name: Verify research certificates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Recompute every published certificate
        run: python -m adfgvx.verify
