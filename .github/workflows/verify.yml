name: Verify research certificates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install research verification dependencies
        run: python -m pip install -r REQUIREMENTS.txt
      - name: Prepare preserved source fixtures
        run: python -m adfgvx.source_editions --materialize
      - name: Verify source-evidence modes fail closed
        run: python -m unittest discover -s tests -p test_source_evidence.py
      - name: Verify published source crops
        run: python data/reviews/verify_source_image_publication.py
      - name: Recompute core source and cipher certificates
        run: python -m adfgvx.verify
      - name: Check the challenge and wider-corpus reading tables
        run: |
          python -m adfgvx.catalog --check
          python -m adfgvx.navigation --check
          python -m adfgvx.source_editions --check
          python -m adfgvx.page_editions --check
          python -m unittest discover -s tests -p test_source_editions.py
          python -m unittest discover -s tests -p test_editorial_style.py
          python -m unittest discover -s tests -p test_page_editions.py
          python -m unittest discover -s tests -p test_source_gap_evidence.py
          python data/reviews/check_reading_presentation.py
          python data/reviews/verify_live_readable_mappings.py
          python experiments/p136_source_glyph_correction/verify.py --verify
          python experiments/p105_optional_two_deletions/verify.py --verify
          python experiments/p132_optional_address/verify.py --verify
          python data/reviews/verify_catalog_source_identity.py
          python -m unittest discover -s tests -p test_catalog_source_identity.py
          python experiments/open_source_records/verify.py
          python data/reviews/verify_continuation_source_counts.py --verify
          python experiments/p63_optional_technical_reading/verify.py --verify
          python experiments/p137_optional_staff_vocabulary/verify.py --verify
          python experiments/p137_governing_clause/verify.py --verify
          python experiments/p137_governing_clause/verify_completion.py --verify
          python experiments/p164_occupation_fragment/verify.py --verify
          python experiments/p89_guard_battalion_extension/verify.py --verify
