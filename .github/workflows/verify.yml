name: Verify research certificates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Recompute core source and cipher certificates
        run: python -m adfgvx.verify
      - name: Check the challenge and wider-corpus reading tables
        run: |
          python -m adfgvx.catalog --check
          python -m adfgvx.navigation --check
          python experiments/session_review/verify.py --verify
          python experiments/post_push_review/verify.py --verify
          python data/reviews/verify_reading_conventions.py
          python data/reviews/verify_manual_readings.py
          python data/reviews/verify_semantic_readings.py
          python data/reviews/verify_reading_conventions.py --snapshot data/reviews/reading_conventions_layers_before.json --audit data/reviews/reading_conventions_layers_audit.json
          python data/reviews/verify_reading_conventions.py --snapshot data/reviews/reading_conventions_spacing_before.json --audit data/reviews/reading_conventions_spacing_audit.json
          python data/reviews/check_reading_presentation.py
          python data/reviews/verify_live_readable_mappings.py
      - name: Verify wider-corpus source readings
        run: |
          python experiments/corpus_readings/verify.py --verify
          python experiments/corpus_recovery/verify.py --verify
          python experiments/withdrawal_recovery/verify.py --verify
          python experiments/corpus_extension/verify.py --verify
          python experiments/october_caucasus/verify.py --verify
          python experiments/october_staffing/verify.py --verify
          python experiments/october_requests/verify.py --verify
          python experiments/operational_recovery/verify.py --verify
          python experiments/late_key_interpretation/verify.py --verify
          python experiments/nov14_retransmissions/verify.py --verify
          python experiments/tiflis_appointment/verify.py --verify
          python experiments/warsaw_service_messages/verify.py --verify
          python experiments/naval_armistice_order/verify.py --verify
          python experiments/siedlce_withdrawal/verify.py --verify
          python experiments/black_sea_shipping/verify.py --verify
          python experiments/corcovado_sale_terms/verify.py --verify
          python experiments/turkish_tonnage/verify.py --verify
          python experiments/constantinople_civilians/verify.py --verify
          python experiments/breslau_staff_transfer/verify.py --verify
          python experiments/lei_note_exchange/verify.py --verify
          python experiments/crown_cash_requests/verify.py --verify
          python experiments/boots_request/geometry.py --verify
          python experiments/boots_request/verify.py --verify
          python experiments/boots_request/breslau_context/verify.py --verify
          python experiments/aviation_connection/verify.py --verify
          python experiments/aviation_connection/verify_companion.py --verify
          python experiments/corpus_attack/build_source_pairs.py --verify
          python experiments/corpus_attack/verify_source_pairs.py
          python experiments/corpus_joint/build_readings.py experiments/corpus_joint/p205_inputs.json experiments/corpus_joint/p205_readings.json --verify
          python experiments/corpus_joint/verify_p205.py
          python experiments/p170_continuation/verify_seifert.py
          python experiments/p170_continuation/verify_military.py
          python experiments/p170_continuation/verify_military_context.py
          python experiments/courier_recovery/build.py --verify
          python experiments/courier_recovery/verify.py
          python experiments/open_targets_continuation/verify.py --verify
      - name: Verify source editions added after publication
        run: |
          python experiments/crown_airlift/verify.py --verify
          python experiments/zitag_purchase_orders/verify.py --verify
          python experiments/military_allowances/verify.py --verify
          python experiments/orient_intelligence/verify.py --verify
          python experiments/liman_troop_reports/verify.py --verify
