          python experiments/nov1_ammunition_and_leave/verify.py --verify
          python experiments/hungarian_armistice_instructions/verify.py --verify
          python experiments/sevastopol_coded_routing/verify.py --verify
          python experiments/nov8_map_and_boundary/verify.py --verify
          python experiments/nov7_fragments_and_council/verify.py --verify
          python experiments/nov9_urgent_embassy_address/verify.py --verify
          python experiments/odd_fragment_diagnostics/verify.py --verify
          python experiments/nov8_radio_keys_and_reports/parallel_witnesses.py --verify
          python experiments/oct31_armistice_and_followup/verify.py --verify
          python experiments/nov1_nov2_native_dispatches/verify.py --verify
