name: Verify research certificates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Recompute core source and cipher certificates
        run: python -m adfgvx.verify
      - name: Check the challenge and wider-corpus reading tables
        run: |
          python -m adfgvx.catalog --check
          python -m adfgvx.navigation --check
          python experiments/session_review/verify.py --verify
          python experiments/post_push_review/verify.py --verify
      - name: Verify wider-corpus source readings
        run: |
          python experiments/corpus_readings/verify.py --verify
          python experiments/corpus_recovery/verify.py --verify
          python experiments/withdrawal_recovery/verify.py --verify
          python experiments/corpus_extension/verify.py --verify
          python experiments/october_caucasus/verify.py --verify
          python experiments/october_staffing/verify.py --verify
          python experiments/october_requests/verify.py --verify
          python experiments/operational_recovery/verify.py --verify
          python experiments/late_key_interpretation/verify.py --verify
          python experiments/nov14_retransmissions/verify.py --verify
          python experiments/tiflis_appointment/verify.py --verify
          python experiments/warsaw_service_messages/verify.py --verify
          python experiments/naval_armistice_order/verify.py --verify
          python experiments/siedlce_withdrawal/verify.py --verify
          python experiments/black_sea_shipping/verify.py --verify
          python experiments/corcovado_sale_terms/verify.py --verify
          python experiments/turkish_tonnage/verify.py --verify
          python experiments/constantinople_civilians/verify.py --verify
          python experiments/breslau_staff_transfer/verify.py --verify
          python experiments/lei_note_exchange/verify.py --verify
          python experiments/crown_cash_requests/verify.py --verify
          python experiments/boots_request/geometry.py --verify
          python experiments/boots_request/verify.py --verify
          python experiments/boots_request/breslau_context/verify.py --verify
          python experiments/aviation_connection/verify.py --verify
          python experiments/aviation_connection/verify_companion.py --verify
          python experiments/corpus_attack/build_source_pairs.py --verify
          python experiments/corpus_attack/verify_source_pairs.py
          python experiments/corpus_joint/build_readings.py experiments/corpus_joint/p205_inputs.json experiments/corpus_joint/p205_readings.json --verify
          python experiments/corpus_joint/verify_p205.py
          python experiments/p170_continuation/verify_seifert.py
          python experiments/p170_continuation/verify_military.py
          python experiments/p170_continuation/verify_military_context.py
          python experiments/courier_recovery/build.py --verify
          python experiments/courier_recovery/verify.py
          python experiments/open_targets_continuation/verify.py --verify
      - name: Verify source editions added after publication
        run: |
          python experiments/crown_airlift/verify.py --verify
          python experiments/zitag_purchase_orders/verify.py --verify
          python experiments/military_allowances/verify.py --verify
          python experiments/orient_intelligence/verify.py --verify
          python experiments/liman_troop_reports/verify.py --verify
          python experiments/military_intendant_remit/verify.py --verify
          python experiments/neuhof_demobilization/verify.py --verify
          python experiments/turkish_mission_recall/verify.py --verify
          python experiments/hungary_transport_warning/verify.py --verify
          python experiments/september_radio_procedure/verify.py --verify
          python experiments/late_transport_dispatches/verify.py --verify
          python experiments/armistice_transit_planning/verify.py --verify
          python experiments/armistice_transit_planning/geometry_audit.py --verify
          python experiments/deutzitag_dispatch_inquiries/verify.py --verify
          python experiments/constanza_radio_connections/verify.py --verify
          python experiments/mackensen_armistice_appeal/verify.py --verify
          python experiments/nov25_letter_constraint/verify.py --verify
      - name: Verify new word, radio and open-target witnesses
        run: |
          python experiments/p198_word_search/verify.py
          python experiments/radio_domain_model/verify.py
          python experiments/radio_domain_model/digit_symmetry/verify.py
          python experiments/p170_new_methods/verify.py
          python experiments/p73_new_methods/verify.py --skip-assignment
      - name: Independently verify all reported source-retrieval assignments
        if: matrix.python == '3.13'
        run: |
          python -m pip install -r experiments/p73_new_methods/requirements-assignment.txt
          python experiments/p73_new_methods/verify.py
      - name: Check recorded truncation constraints
        run: python experiments/known_key/verify_p170.py experiments/known_key/p170_experiment.json
      - name: Build search engines and check controls
        if: matrix.python == '3.13'
        run: make -C experiments/joint_search check
      - name: Build fixed-search engines and verify their input layers
        if: matrix.python == '3.13'
        run: make -C experiments/fixed_search check
      - name: Verify new p153 source layers and conditional completions
        run: |
          python experiments/p153_recovery/verify_certificate.py
          python experiments/p215_completion/verify_completions.py
          python experiments/anchored_search/verify_results.py
      - name: Verify additional source and suffix audits
        run: |
          python experiments/source_followup/verify_context.py --verify
          python experiments/source_followup/audit_p186.py --verify
          python experiments/p187b_adjacent_swap/audit.py --verify
      - name: Verify linked p153 fields and key-construction bounds
        if: matrix.python == '3.13'
        run: |
          python experiments/p153_extension/analyze.py --verify
          python experiments/p153_key_structure/analyze.py --verify
      - name: Verify transport parallels and editorial context
        run: |
          python experiments/transport_followup/verify_transport_families.py
          python experiments/transport_followup/analyze_linked_fields.py --verify
          python experiments/p215_context/audit_interpretation.py --check
          python experiments/parallel_decoder/summarize.py --verify
          python experiments/source_similarity_extension/check_source.py --verify
      - name: Verify recorded exact-loss source witnesses
        run: |
          python experiments/p198_joint_exact/verify_recorded.py
          python experiments/p198_letter_bounds/verify_recorded.py
          python experiments/p198_letter_bounds/domain_witnesses.py --verify
          python experiments/p198_joint_six/verify_recorded.py
          python experiments/p198_six_historical/verify_recorded.py
      - name: Recompute the exact partial-key category bound
        run: python experiments/p198_letter_bounds/verify_category_exact.py --verify
      - name: Recompute the exact digit and Q/Y frontier
        run: |
          python experiments/p198_category_frontier/verify_recorded.py
          python experiments/p198_category_frontier/verify_independent.py --verify
          python experiments/contextual_key_constraints/verify.py --verify
          python experiments/contextual_key_constraints/verify_independent.py --verify
      - name: Verify completed open-target inputs and bounds
        run: python experiments/open_targets/verify_light.py
      - name: Recompute exhaustive p153 crib constraints
        if: matrix.python == '3.13'
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror -o /tmp/p153-enumerate experiments/p153_crib/enumerate.c
          python experiments/p153_crib/verify_and_control.py --engine /tmp/p153-enumerate
          python experiments/p153_crib/independent/enumerate_independent.py --input experiments/p153_crib/historical_input.txt --output /tmp/p153-independent.json
          python experiments/p153_corpus/run_screen.py --verify
      - name: Check even-width exclusions and arbitrary p215 insertions
        if: matrix.python == '3.13'
        run: |
          python experiments/p153_even_widths/check_exclusions.py --output /tmp/p153-even-exclusions.json
          python experiments/p215_completion/check_editorial_alignment.py
          python experiments/p215_completion/p215_editorial_alignment_independent.py --prior-readings data/prior_readings.json --expected experiments/p215_completion/editorial_alignment.json
      - name: Verify row-crossing odd-width geometry
        if: matrix.python == '3.13'
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror experiments/p153_odd_widths/enumerate_components.c -o /tmp/p153-components
          python experiments/p153_odd_widths/run_and_verify.py --engine /tmp/p153-components --output /tmp/p153-components-results
